---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nixite
  labels:
    app.kubernetes.io/name: nixite
    app.kubernetes.io/version: "2.1.0"

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nixite-config
  namespace: nixite
data:
  config.js: |
    const NIXITE_CONFIG = {
      api: {
        base: "http://localhost:8000",
        installer: "http://localhost:8000/api/install",
        luminousBridge: "http://localhost:8890"
      },
      features: {
        voiceInput: true,
        aiFeedback: true,
        installManager: true,
        luminousBridge: true
      },
      network: {
        timeout: 10000,
        retryAttempts: 3,
        retryDelay: 1000,
        healthCheckTimeout: 2000
      },
      luminousBridge: {
        enabled: true,
        port: 8890,
        model: "gemma:2b",
        timeout: 30000
      }
    };

---
# Web Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixite-web
  namespace: nixite
  labels:
    app: nixite
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nixite
      component: web
  template:
    metadata:
      labels:
        app: nixite
        component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: web
        image: ghcr.io/luminous-dynamics/nixite:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: config
          mountPath: /app/config.js
          subPath: config.js
      volumes:
      - name: config
        configMap:
          name: nixite-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# AI Bridge Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixite-bridge
  namespace: nixite
  labels:
    app: nixite
    component: bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nixite
      component: bridge
  template:
    metadata:
      labels:
        app: nixite
        component: bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8890"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: bridge
        image: ghcr.io/luminous-dynamics/nixite-bridge:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8890
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8890"
        - name: OLLAMA_HOST
          value: "ollama:11434"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8890
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8890
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# Ollama Deployment (for AI features)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: nixite
  labels:
    app: nixite
    component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixite
      component: ollama
  template:
    metadata:
      labels:
        app: nixite
        component: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        env:
        - name: OLLAMA_NUM_PARALLEL
          value: "2"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc

---
# PersistentVolumeClaim for Ollama
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: nixite
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Service for Web
apiVersion: v1
kind: Service
metadata:
  name: nixite-web
  namespace: nixite
  labels:
    app: nixite
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: nixite
    component: web

---
# Service for AI Bridge
apiVersion: v1
kind: Service
metadata:
  name: nixite-bridge
  namespace: nixite
  labels:
    app: nixite
    component: bridge
spec:
  type: ClusterIP
  ports:
  - port: 8890
    targetPort: 8890
    protocol: TCP
    name: http
  selector:
    app: nixite
    component: bridge

---
# Service for Ollama
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: nixite
  labels:
    app: nixite
    component: ollama
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
    protocol: TCP
    name: http
  selector:
    app: nixite
    component: ollama

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nixite-ingress
  namespace: nixite
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - nixite.example.com
    secretName: nixite-tls
  rules:
  - host: nixite.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nixite-web
            port:
              number: 8000
      - path: /api/bridge
        pathType: Prefix
        backend:
          service:
            name: nixite-bridge
            port:
              number: 8890

---
# HorizontalPodAutoscaler for Web
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nixite-web-hpa
  namespace: nixite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nixite-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HorizontalPodAutoscaler for AI Bridge
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nixite-bridge-hpa
  namespace: nixite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nixite-bridge
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

---
# PodDisruptionBudget for Web
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nixite-web-pdb
  namespace: nixite
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nixite
      component: web

---
# PodDisruptionBudget for Bridge
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nixite-bridge-pdb
  namespace: nixite
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nixite
      component: bridge

---
# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nixite-web
  namespace: nixite
  labels:
    app: nixite
spec:
  selector:
    matchLabels:
      app: nixite
      component: web
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
# ServiceMonitor for AI Bridge
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nixite-bridge
  namespace: nixite
  labels:
    app: nixite
spec:
  selector:
    matchLabels:
      app: nixite
      component: bridge
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
# NetworkPolicy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nixite-network-policy
  namespace: nixite
spec:
  podSelector:
    matchLabels:
      app: nixite
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8890
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nixite
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
