name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Lint and validate files
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Validate JSON files
      run: |
        echo "Validating JSON files..."
        for file in *.json; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            jq empty "$file" || exit 1
          fi
        done
        echo "✅ All JSON files are valid"

    - name: Validate JavaScript syntax
      run: |
        echo "Validating JavaScript files..."
        for file in *.js; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            node --check "$file" || exit 1
          fi
        done
        echo "✅ All JavaScript files are valid"

    - name: Check for TODOs and FIXMEs
      run: |
        echo "Checking for TODO/FIXME comments..."
        grep -rn "TODO\|FIXME" --include="*.js" --include="*.html" . || echo "✅ No TODOs or FIXMEs found"

  # Test the application
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Test web server startup
      run: |
        echo "Testing web server startup..."
        python3 -m http.server 8000 &
        SERVER_PID=$!
        sleep 2

        # Test if server is responding
        curl -f http://localhost:8000 || exit 1

        kill $SERVER_PID
        echo "✅ Web server test passed"

    - name: Test package data loading
      run: |
        echo "Testing package data..."
        node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('nixite-packages.json', 'utf8'));

          if (!data.packages || !Array.isArray(data.packages)) {
            console.error('❌ Invalid package data structure');
            process.exit(1);
          }

          console.log(\`✅ Found \${data.packages.length} packages\`);

          // Validate each package has required fields
          const categories = ['create', 'connect', 'grow', 'work', 'play', 'secure', 'manage', 'serve'];

          data.packages.forEach((pkg, idx) => {
            if (!pkg.id || !pkg.name || !pkg.description || !pkg.category) {
              console.error(\`❌ Package at index \${idx} is missing required fields\`);
              process.exit(1);
            }

            if (!categories.includes(pkg.category)) {
              console.error(\`❌ Package '\${pkg.id}' has invalid category: \${pkg.category}\`);
              process.exit(1);
            }
          });

          console.log('✅ All packages are valid');
        "

    - name: Test configuration
      run: |
        echo "Testing configuration..."
        node -e "
          const config = require('./config.js');

          if (!config.api || !config.features || !config.network) {
            console.error('❌ Invalid config structure');
            process.exit(1);
          }

          console.log('✅ Configuration is valid');
        "

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for sensitive files
      run: |
        echo "Checking for sensitive files..."
        sensitive_patterns=(".env" "*.key" "*.pem" "*secret*" "*password*")

        for pattern in "${sensitive_patterns[@]}"; do
          if find . -name "$pattern" -not -path "./.git/*" | grep -q .; then
            echo "⚠️  Warning: Found files matching sensitive pattern: $pattern"
          fi
        done

        echo "✅ Sensitive file check complete"

  # Build and validate
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Validate project structure
      run: |
        echo "Validating project structure..."

        required_files=(
          "index.html"
          "README.md"
          "LICENSE"
          "package.json"
          "nixite-packages.json"
          "config.js"
          "start.sh"
        )

        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Required file missing: $file"
            exit 1
          fi
        done

        echo "✅ All required files present"

    - name: Check documentation
      run: |
        echo "Checking documentation..."

        # Check README has minimum content
        if [ $(wc -l < README.md) -lt 50 ]; then
          echo "⚠️  Warning: README seems short"
        fi

        # Check for broken markdown links (basic check)
        if grep -q "]()" README.md; then
          echo "⚠️  Warning: Found empty markdown links in README"
        fi

        echo "✅ Documentation check complete"

  # Deploy preview (only for PRs)
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment comment
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🚀 Deployment Preview

            ✅ All checks passed! This PR is ready for review.

            ### Test locally:
            \`\`\`bash
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
            ./start.sh
            \`\`\`

            Then open http://localhost:8000
            `
          })

  # Report status
  status-report:
    name: Status Report
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
    - name: Report success
      if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' && needs.build.result == 'success' }}
      run: |
        echo "✅ All CI checks passed!"
        echo "The code is ready for deployment."

    - name: Report failure
      if: ${{ needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' || needs.build.result == 'failure' }}
      run: |
        echo "❌ Some CI checks failed."
        echo "Please review the logs above."
        exit 1
