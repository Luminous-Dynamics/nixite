# Nginx Reverse Proxy Configuration for Nixite
#
# This configuration provides a production-ready reverse proxy setup with:
# - HTTPS/SSL termination
# - Security headers
# - Rate limiting
# - Gzip compression
# - WebSocket support (for future features)
# - Caching for static assets
#
# Installation:
#   1. Place this file in /etc/nginx/sites-available/nixite
#   2. Create symlink: ln -s /etc/nginx/sites-available/nixite /etc/nginx/sites-enabled/nixite
#   3. Obtain SSL certificate (Let's Encrypt recommended)
#   4. Update server_name and SSL paths
#   5. Test: nginx -t
#   6. Reload: systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=nixite_limit:10m rate=10r/s;

# Upstream servers
upstream nixite_web {
    server 127.0.0.1:8000;
    # For load balancing, add more servers:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;

    # Connection keep-alive
    keepalive 32;
}

upstream nixite_bridge {
    server 127.0.0.1:8890;
    keepalive 16;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nixite.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nixite.example.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/nixite.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixite.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nixite.example.com/chain.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.example.com;" always;

    # Logging
    access_log /var/log/nginx/nixite-access.log;
    error_log /var/log/nginx/nixite-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Client body size (for future file uploads)
    client_max_body_size 10M;

    # Main application
    location / {
        # Rate limiting
        limit_req zone=nixite_limit burst=20 nodelay;

        # Proxy headers
        proxy_pass http://nixite_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Caching
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }

    # AI Bridge API
    location /api/bridge/ {
        # Rate limiting (stricter for API)
        limit_req zone=nixite_limit burst=10 nodelay;

        # Proxy to bridge
        proxy_pass http://nixite_bridge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI processing
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # No caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nixite_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # JSON data files (can be cached but shorter)
    location ~* \.(json)$ {
        proxy_pass http://nixite_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache JSON files
        expires 1h;
        add_header Cache-Control "public";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://nixite_web/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Additional configuration for monitoring (optional)
# Nginx status page (restrict access!)
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
