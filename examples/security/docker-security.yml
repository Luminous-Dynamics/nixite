# Docker Compose with Security Hardening
# Production-grade security configurations for containerized deployment

version: '3.8'

services:
  nixite-web:
    image: nixite:latest
    container_name: nixite-web

    # Security options
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
      - apparmor:docker-default

    # Read-only root filesystem
    read_only: true

    # Capabilities (drop all, add only what's needed)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Tmpfs for writable directories
    tmpfs:
      - /tmp:size=100M,mode=1777
      - /var/tmp:size=50M,mode=1777
      - /run:size=50M,mode=755

    # User (non-root)
    user: "1000:1000"

    # Network
    networks:
      nixite-internal:
        aliases:
          - web

    # Ports (only expose internally)
    expose:
      - "8000"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
        env: "NODE_ENV"

    # Environment variables (use secrets instead in production)
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info

    # Labels
    labels:
      com.nixite.service: "web"
      com.nixite.environment: "production"
      com.nixite.security: "hardened"

    # Restart policy
    restart: unless-stopped

  nixite-bridge:
    image: nixite-bridge:latest
    container_name: nixite-bridge

    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    tmpfs:
      - /tmp:size=200M,mode=1777
      - /var/tmp:size=100M,mode=1777

    user: "1000:1000"

    networks:
      nixite-internal:
        aliases:
          - bridge
      ollama-network:

    expose:
      - "8890"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - NODE_ENV=production
      - OLLAMA_HOST=ollama:11434
      - LOG_LEVEL=info

    labels:
      com.nixite.service: "bridge"
      com.nixite.environment: "production"

    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: nixite-ollama

    security_opt:
      - no-new-privileges:true

    # Ollama needs write access for models
    read_only: false

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

    user: "1000:1000"

    networks:
      ollama-network:
        aliases:
          - ollama

    expose:
      - "11434"

    volumes:
      - ollama-models:/root/.ollama:rw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - OLLAMA_HOST=0.0.0.0:11434

    labels:
      com.nixite.service: "ollama"
      com.nixite.environment: "production"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nixite-nginx

    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    tmpfs:
      - /tmp:size=50M,mode=1777
      - /var/run:size=10M,mode=755
      - /var/cache/nginx:size=100M,mode=755

    user: "101:101"  # nginx user in Alpine

    networks:
      nixite-internal:
      public:

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./examples/security/nginx-hardened.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx:rw

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.nixite.service: "nginx"
      com.nixite.environment: "production"
      com.nixite.security: "hardened"

    restart: unless-stopped

    depends_on:
      - nixite-web
      - nixite-bridge

  # Security scanning with Trivy
  trivy-scanner:
    image: aquasec/trivy:latest
    container_name: nixite-trivy

    security_opt:
      - no-new-privileges:true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/trivy

    command: >
      sh -c "
        trivy image --severity HIGH,CRITICAL nixite:latest &&
        trivy image --severity HIGH,CRITICAL nixite-bridge:latest
      "

    networks:
      - nixite-internal

    restart: "no"

    profiles:
      - security-scan

networks:
  # Internal network for services
  nixite-internal:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-nixite
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

  # Network for Ollama communication
  ollama-network:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

  # Public network (only for nginx)
  public:
    driver: bridge

volumes:
  ollama-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/nixite/ollama-models

  nginx-logs:
    driver: local

  trivy-cache:
    driver: local

# Secrets (for production, use Docker secrets or external secret management)
secrets:
  api_key:
    file: ./secrets/api_key.txt
  db_password:
    file: ./secrets/db_password.txt
