# Hardened Nginx Configuration for Nixite
# Production-ready security best practices

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=nixite_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nixite_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nixite_ai:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# SSL session cache
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Upstream definitions
upstream nixite_web {
    least_conn;
    server localhost:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream nixite_bridge {
    least_conn;
    server localhost:8890 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nixite.example.com;

    # Security headers even for redirects
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nixite.example.com;

    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/nixite.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixite.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nixite.example.com/chain.pem;

    # Modern SSL configuration (Mozilla Modern)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Remove server tokens
    server_tokens off;
    more_clear_headers Server;

    # Connection limits
    limit_conn addr 10;

    # Request size limits
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Buffer overflow protection
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Logging with privacy
    access_log /var/log/nginx/nixite-access.log combined buffer=32k flush=1m;
    error_log /var/log/nginx/nixite-error.log warn;

    # Root location
    location / {
        # Rate limiting
        limit_req zone=nixite_general burst=20 nodelay;

        proxy_pass http://nixite_web;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Security
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # API endpoints with stricter rate limiting
    location /api/bridge/ {
        # Aggressive rate limiting for AI endpoints
        limit_req zone=nixite_ai burst=10 nodelay;

        proxy_pass http://nixite_bridge/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI processing
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Request validation
        if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
            return 405;
        }
    }

    # Health check endpoint (no rate limiting)
    location /health {
        limit_req zone=nixite_general burst=5 nodelay;
        proxy_pass http://nixite_web/health;
        access_log off;
    }

    # Metrics endpoint (restrict to monitoring systems)
    location /metrics {
        allow 10.0.0.0/8;      # Internal network
        allow 172.16.0.0/12;   # Private network
        allow 192.168.0.0/16;  # Local network
        deny all;

        proxy_pass http://nixite_bridge/metrics;
        access_log off;
    }

    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=nixite_general burst=50 nodelay;

        proxy_pass http://nixite_web;

        # Caching
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Security headers (inherit from server block)
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
    }

    # Block common attack patterns
    location ~* (\.git|\.env|\.htaccess|\.htpasswd|backup|\.bak|\.old|\.sql|\.dump) {
        deny all;
        return 404;
    }

    # Block suspicious user agents
    if ($http_user_agent ~* (masscan|nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
        return 403;
    }

    # Block SQL injection attempts
    if ($args ~* (union|select|insert|cast|set|declare|drop|update|md5|benchmark)) {
        return 403;
    }

    # Block XSS attempts
    if ($args ~* (<|>|'|%0A|%0D|%27|%3C|%3E|%00)) {
        return 403;
    }

    # Block file inclusion attempts
    if ($args ~* (\.\.\/|\.\.\\|etc\/passwd|boot\.ini)) {
        return 403;
    }
}

# Admin interface (optional, highly restricted)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nixite.example.com;

    ssl_certificate /etc/letsencrypt/live/nixite.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixite.example.com/privkey.pem;

    # IP whitelist
    allow 10.0.0.0/8;
    deny all;

    # HTTP Basic Auth
    auth_basic "Nixite Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://nixite_web;
    }
}
